<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog mt-5">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Login</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="email" name="" id="" placeholder="Email" class="form-control my-3">
        <input type="password" name="" id="" placeholder="Password" class="form-control my-3">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Login</button>
      </div>
    </div>
  </div>

<div class="modal fade" id="register" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog mt-5">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Register</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

        <input type="password" name="" id="" placeholder="Password" class="form-control my-3">

      <div class="modal-footer">

        <button type="button" class="btn btn-primary">Login</button>

    </div>
  </div>

<div class="container">
        <div class="row my-3">
            <div class="col-lg-5 shadow-lg p-3 m-auto rounded-4 bg-info">
                <form action="">
                <h1 class="text-center text-white">Contact Form</h1>
                <input type="text" name="uname" id="uname" class="form-control my-3" placeholder="Enter Your Username">
                <input type="text" name="umail" id="umail" class="form-control my-3" placeholder="Enter Your Email">
                <select name="opt" id="opt" class="form-control my-3">
                    <option value="selected">Select Your Favourite Language...</option>
                    <option value="html">HTML 5</option>
                    <option value="css">CSS 3</option>
                    <option value="java">JavaScript</option>
                </select>
                <textarea name="comment" id="comment" class="form-control my-3" rows="9" placeholder="Write Your Thought Of About Your Web Language..."></textarea>
                <div class="d-grid justify-content-center">
                <button class="btn btn-primary fs-5 text-white px-5 py-2 rounded-2">Send Msg</button>
                </div>
                </form>
            </div>
